[package]
name = "qingdou-workbench"
version = "0.1.0"
description = "本地优先的视频创作桌面工作台"
authors = ["SharkyTang"]
edition = "2021"

[lib]
name = "qingdou_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
