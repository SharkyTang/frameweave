[package]
name = "frameweave-workbench"
version = "0.1.0"
description = "本地优先的视频创作桌面工作台"
authors = ["SharkyTang"]
edition = "2021"

[lib]
name = "frameweave_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
rfd = "0.17"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
libc = "0.2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
